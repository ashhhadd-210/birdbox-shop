    <linearGradient id="face-cedar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c98f5b"/><stop offset=".55" stop-color="#b0743f"/><stop offset="1" stop-color="#8a5628"/>
    </linearGradient>
    <linearGradient id="roof-cedar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b0743f"/><stop offset="1" stop-color="#6d4320"/>
    </linearGradient>
    <linearGradient id="side-cedar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a5628"/><stop offset="1" stop-color="#6d4320"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect width="640" height="520" fill="url(#sky)"/>
