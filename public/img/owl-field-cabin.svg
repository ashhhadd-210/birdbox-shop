<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520" role="img">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f4ec"/><stop offset="1" stop-color="#e8eee3"/>
    </linearGradient>
    <radialGradient id="cavity" cx=".38" cy=".32" r=".85">
      <stop offset="0" stop-color="#4a3520"/><stop offset=".6" stop-color="#2b1e12"/><stop offset="1" stop-color="#150f09"/>
    </radialGradient>
    <linearGradient id="face-ply" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5f5346"/><stop offset=".55" stop-color="#4b4239"/><stop offset="1" stop-color="#3a332c"/>
    </linearGradient>
    <linearGradient id="roof-ply" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b4239"/><stop offset="1" stop-color="#2a251f"/>
    </linearGradient>
    <linearGradient id="side-ply" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a332c"/><stop offset="1" stop-color="#2a251f"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect width="640" height="520" fill="url(#sky)"/>
