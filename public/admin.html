<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orders desk — Hollow &amp; Home</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/styles.css">
<style>
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1.25rem; margin-bottom: 2.5rem; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.4rem; }
  .kpi strong { display: block; font-family: var(--serif); font-size: 2rem; line-height: 1.1; }
  .kpi span { font-size: .74rem; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-3); }
  .order { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.5rem; margin-bottom: 1.25rem; }
  .order__head { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; align-items: baseline; border-bottom: 1px solid var(--line); padding-bottom: .9rem; margin-bottom: .9rem; }
  .order__ref { font-family: var(--serif); font-size: 1.2rem; }
  .order__grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
  .pill { font: 600 .68rem var(--sans); letter-spacing: .08em; text-transform: uppercase; background: var(--green-soft); color: var(--green-2); padding: .3rem .6rem; border-radius: 6px; }
  .order dl { margin: 0; font-size: .9rem; }
  .order dt { font: 600 .68rem var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); margin-top: .8rem; }
  .order dd { margin: .15rem 0 0; color: var(--ink-2); }
  @media (max-width: 760px) { .order__grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header class="site-head">
  <div class="wrap head__row">
    <a class="brand" href="/">
      <svg class="brand__mark" viewBox="0 0 48 48" aria-hidden="true">
        <path d="M24 5 4 17v3h40v-3z" fill="#4f7a4a"/>
        <rect x="9" y="20" width="30" height="23" rx="3" fill="#7a5a34"/>
        <circle cx="24" cy="28" r="6" fill="#2b1e12"/>
      </svg>
      <span class="brand__text"><strong>Hollow &amp; Home</strong><small>Orders desk</small></span>
    </a>
    <nav class="nav" style="margin-left:auto"><a href="/">← Back to the shop</a></nav>
  </div>
</header>

<main class="wrap band">
  <p class="eyebrow">Workshop</p>
  <h1>Orders desk</h1>
  <p class="lede">Everything placed through the storefront, newest first. Stock is decremented from <code>data/products.json</code> as orders come in.</p>
  <div class="kpis" id="kpis"></div>
  <div id="orders"></div>
</main>

<script>
const money = (n) => '£' + n.toFixed(2);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const when = (iso) => new Date(iso).toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short' });

fetch('/api/orders').then(r => r.json()).then(d => {
  const boxes = d.orders.reduce((s, o) => s + o.items.reduce((t, i) => t + i.qty, 0), 0);
  const trees = d.orders.reduce((s, o) => s + (o.treesPlanted || 0), 0);
  const avg = d.count ? d.revenue / d.count : 0;

  document.getElementById('kpis').innerHTML = `
    <div class="kpi"><strong>${d.count}</strong><span>Orders</span></div>
    <div class="kpi"><strong>${money(d.revenue)}</strong><span>Revenue</span></div>
    <div class="kpi"><strong>${money(avg)}</strong><span>Average order</span></div>
    <div class="kpi"><strong>${boxes}</strong><span>Boxes to make</span></div>
    <div class="kpi"><strong>${trees}</strong><span>Trees owed</span></div>`;

  document.getElementById('orders').innerHTML = d.orders.length ? d.orders.map(o => `
    <article class="order">
      <div class="order__head">
        <div>
          <div class="order__ref">${esc(o.ref)}</div>
          <small style="color:var(--ink-3)">${when(o.placedAt)}</small>
        </div>
        <div style="text-align:right">
          <span class="pill">${esc(o.status)}</span>
          <div style="font-family:var(--serif);font-size:1.3rem;margin-top:.3rem">${money(o.total)}</div>
        </div>
      </div>
      <div class="order__grid">
        <div>
          <dl>
            <dt>Customer</dt><dd>${esc(o.customer.name)}</dd>
            <dt>Contact</dt><dd>${esc(o.customer.email)}${o.customer.phone ? ' · ' + esc(o.customer.phone) : ''}</dd>
            <dt>Deliver to</dt><dd>${esc(o.customer.address1)}${o.customer.address2 ? '<br>' + esc(o.customer.address2) : ''}<br>${esc(o.customer.city)}<br>${esc(o.customer.postcode)}</dd>
            ${o.customer.notes ? `<dt>Notes</dt><dd>${esc(o.customer.notes)}</dd>` : ''}
          </dl>
        </div>
        <div>
          <dl><dt>Bench list</dt></dl>
          ${o.items.map(i => `<div class="sumline"><span>${esc(i.name)} × ${i.qty}</span><span>${money(i.lineTotal)}</span></div>`).join('')}
          <div class="sumline"><span>Shipping</span><span>${o.shipping ? money(o.shipping) : 'Free'}</span></div>
          <div class="sumline sumline--total"><span>Total</span><span>${money(o.total)}</span></div>
          <div class="sumline"><span>Trees to plant</span><span>${o.treesPlanted}</span></div>
        </div>
      </div>
    </article>`).join('')
    : '<div class="empty"><p>No orders yet. Place one through the storefront and it will appear here.</p><a class="btn btn--primary" href="/">Open the shop</a></div>';
}).catch(() => {
  document.getElementById('orders').innerHTML = '<div class="errors">Could not reach the server.</div>';
});
</script>
</body>
</html>
